group 'id.kakzaki.blue_thermal_printer'


buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.5.4'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'id.kakzaki.blue_thermal_printer'
    compileSdkVersion 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        minSdkVersion 18
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    buildFeatures {
        // Dibutuhkan untuk mengompilasi AIDL vendor Sunmi di
        // src/main/aidl/woyou/aidlservice/jiuiv5/.
        aidl true
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Hanya untuk helper Java murni (RasterImageEncoder, EscPosStatus) -- lihat src/test/.
    testImplementation 'junit:junit:4.13.2'
}
